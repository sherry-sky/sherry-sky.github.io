<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记阅读 - 微积分 1M</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, processEnvironments: true, packages: {'[+]': ['noerrors']} },
      svg: { fontCache: 'global' },
      ignoreHtmlClass: 'tex2jax_ignore'
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="navbar-container"></div>
  <script>window.currentCourse = 'calculus-1m';</script>

  <div id="viewer-container"></div>

  <div id="footer-container"></div>
  <script src="../../js/components.js"></script>
  <script src="../../js/content-viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadComponent('navbar', 'navbar-container');
      loadComponent('footer', 'footer-container');
      loadComponent('content-viewer', 'viewer-container');
      setCurrentPage('notes');

      viewerInit({
        type: 'notes',
        navItems: [
          { id: '1', title: 'Week 1 预备知识' },
          { id: '2', title: 'Week 2 函数' },
          { id: '3', title: 'Week 3 极限' },
          { id: '4', title: 'Week 4 连续性与导数' },
          { id: '5', title: 'Week 5 求导法则' },
          { id: '6', title: 'Week 6 极值与中值定理' },
          { id: '7', title: 'Week 7 曲线描绘与反导数' },
          { id: '8', title: 'Week 8 定积分与 FTC' },
          { id: '9', title: 'Week 9 积分技巧（一）' },
          { id: '10', title: 'Week 10 积分技巧（二）与弧长' },
          { id: '11', title: 'Week 11 数列' },
          { id: '12', title: 'Week 12 级数收敛性' },
          { id: '13', title: 'Week 13 幂级数与 Taylor' },
          { id: '14', title: 'Week 14 期中复习' },
          { id: '23', title: 'Week 23 级数进阶' },
          { id: '24', title: 'Week 24 幂级数' },
          { id: '25', title: 'Week 25 Taylor 与二项式' },
          { id: '26', title: 'Week 26 综合复习' }
        ],
        filePattern: 'notes/notes-{id}.md',
        defaultId: '1',
        listPage: 'notes.html',
        titlePrefix: 'Week',
        urlParam: 'chapter',
        course: 'calculus-1m',
        navTitle: '📚 章节导航',
        loadingText: '正在加载笔记内容...',
        errorText: '无法加载笔记内容',
        prevText: '← 上一周',
        nextText: '下一周 →',
        listText: '📝 返回笔记列表'
      });
    });
  </script>
</body>
</html>
