<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研讨课 - 微积分 1M</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, processEnvironments: true, packages: {'[+]': ['noerrors']} },
      svg: { fontCache: 'global' },
      ignoreHtmlClass: 'tex2jax_ignore'
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="navbar-container"></div>
  <script>window.currentCourse = 'calculus-1m';</script>

  <div id="viewer-container"></div>

  <div id="footer-container"></div>
  <script src="../../js/components.js"></script>
  <script src="../../js/content-viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadComponent('navbar', 'navbar-container');
      loadComponent('footer', 'footer-container');
      loadComponent('content-viewer', 'viewer-container');
      setCurrentPage('workshops');

      viewerInit({
        type: 'workshops',
        navItems: [
          { id: '1', title: 'Workshop 1 绝对值与直线' },
          { id: '2', title: 'Workshop 2 函数与反函数' },
          { id: '3', title: 'Workshop 3 连续性与极限' },
          { id: '4', title: 'Workshop 4 隐函数与双曲' },
          { id: '5', title: 'Workshop 5 图像与极值' },
          { id: '6', title: 'Workshop 6 积分技巧' },
          { id: '7', title: 'Workshop 7 积分应用' },
          { id: '8', title: 'Workshop 8 积分进阶' },
          { id: '9', title: 'Workshop 9 反常积分与弧长' },
          { id: '10', title: 'Workshop 10 数列与级数' },
          { id: '11', title: 'Workshop 11 幂级数' },
          { id: '12', title: 'Workshop 12 综合专题' }
        ],
        filePattern: 'workshops/workshop-{id}.md',
        defaultId: '1',
        listPage: 'index.html',
        titlePrefix: 'Workshop',
        urlParam: 'workshop',
        course: 'calculus-1m',
        navTitle: '📚 研讨导航',
        loadingText: '正在加载研讨课内容...',
        errorText: '无法加载研讨课内容',
        prevText: '← 上一次',
        nextText: '下一次 →',
        listText: '🏠 返回首页'
      });
    });
  </script>
</body>
</html>
