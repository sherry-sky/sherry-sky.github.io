<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>习题解答 - 微积分 1M</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, processEnvironments: true, packages: {'[+]': ['noerrors']} },
      svg: { fontCache: 'global' },
      ignoreHtmlClass: 'tex2jax_ignore'
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="navbar-container"></div>
  <script>window.currentCourse = 'calculus-1m';</script>

  <div id="viewer-container"></div>

  <div id="footer-container"></div>
  <script src="../../js/components.js"></script>
  <script src="../../js/content-viewer.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadComponent('navbar', 'navbar-container');
      loadComponent('footer', 'footer-container');
      loadComponent('content-viewer', 'viewer-container');
      setCurrentPage('tutorials');

      viewerInit({
        type: 'tutorials',
        navItems: [
          { id: '1', title: 'Tutorial 1 不等式与绝对值' },
          { id: '2', title: 'Tutorial 2 函数概念' },
          { id: '3', title: 'Tutorial 3 极限' },
          { id: '4', title: 'Tutorial 4 连续性与导数' },
          { id: '5', title: 'Tutorial 5 求导法则' },
          { id: '6', title: 'Tutorial 6 极值与中值定理' },
          { id: '7', title: 'Tutorial 7 曲线描绘与反导数' },
          { id: '8', title: 'Tutorial 8 FTC 与积分应用' },
          { id: '9', title: 'Tutorial 9 积分技巧' },
          { id: '10', title: 'Tutorial 10 反常积分与弧长' },
          { id: '11', title: 'Tutorial 11 数列与级数' },
          { id: '12', title: 'Tutorial 12 收敛性与幂级数' },
          { id: '13', title: 'Tutorial 13 幂级数与 Taylor' }
        ],
        filePattern: 'tutorials/tutorial-{id}.md',
        defaultId: '1',
        listPage: 'tutorials.html',
        titlePrefix: 'Tutorial',
        urlParam: 'tutorial',
        course: 'calculus-1m',
        navTitle: '📚 习题导航',
        loadingText: '正在加载习题内容...',
        errorText: '无法加载习题内容',
        prevText: '← 上一节',
        nextText: '下一节 →',
        listText: '📝 返回习题列表'
      });
    });
  </script>
</body>
</html>
