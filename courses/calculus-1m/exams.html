<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试解答 - 微积分 1M</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, processEnvironments: true, packages: {'[+]': ['noerrors']} },
      svg: { fontCache: 'global' },
      ignoreHtmlClass: 'tex2jax_ignore'
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="navbar-container"></div>
  <script>window.currentCourse = 'calculus-1m';</script>

  <div id="viewer-container"></div>

  <div id="footer-container"></div>
  <script src="../../js/components.js"></script>
  <script src="../../js/content-viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadComponent('navbar', 'navbar-container');
      loadComponent('footer', 'footer-container');
      loadComponent('content-viewer', 'viewer-container');
      setCurrentPage('exams');

      viewerInit({
        type: 'exams',
        navItems: [
          { id: '1', title: '期中考试 2024' },
          { id: '2', title: '期末综合复习 2024' }
        ],
        filePattern: 'exams/exam-{id}.md',
        defaultId: '1',
        listPage: 'index.html',
        titlePrefix: 'Exam',
        urlParam: 'exam',
        course: 'calculus-1m',
        navTitle: '📚 考试导航',
        loadingText: '正在加载考试内容...',
        errorText: '无法加载考试内容',
        prevText: '← 上一个',
        nextText: '下一个 →',
        listText: '🏠 返回首页'
      });
    });
  </script>
</body>
</html>
