<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业解答 - 微积分 1M</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, processEnvironments: true, packages: {'[+]': ['noerrors']} },
      svg: { fontCache: 'global' },
      ignoreHtmlClass: 'tex2jax_ignore'
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="navbar-container"></div>
  <script>window.currentCourse = 'calculus-1m';</script>

  <div id="viewer-container"></div>

  <div id="footer-container"></div>
  <script src="../../js/components.js"></script>
  <script src="../../js/content-viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadComponent('navbar', 'navbar-container');
      loadComponent('footer', 'footer-container');
      loadComponent('content-viewer', 'viewer-container');
      setCurrentPage('homework');

      viewerInit({
        type: 'homework',
        navItems: [
          { id: '1', title: 'HW 1 绝对值不等式与综合' },
          { id: '2', title: 'HW 2 反函数与极限' },
          { id: '3', title: 'HW 3 连续性与渐近线' },
          { id: '4', title: 'HW 4 导数应用' },
          { id: '5', title: 'HW 5 极值与 Riemann 和' },
          { id: '6', title: 'HW 6 FTC 与积分应用' },
          { id: '7', title: 'HW 7 积分技巧与旋转体' },
          { id: '8', title: 'HW 8 反常积分与弧长' },
          { id: '9', title: 'HW 9 数列与级数' },
          { id: '10', title: 'HW 10 幂级数与 Taylor' }
        ],
        filePattern: 'homeworks/homework-{id}.md',
        defaultId: '1',
        listPage: 'homework.html',
        titlePrefix: 'Homework',
        urlParam: 'homework',
        course: 'calculus-1m',
        navTitle: '📚 作业导航',
        loadingText: '正在加载作业内容...',
        errorText: '无法加载作业内容',
        prevText: '← 上一次',
        nextText: '下一次 →',
        listText: '📋 返回作业列表'
      });
    });
  </script>
</body>
</html>
